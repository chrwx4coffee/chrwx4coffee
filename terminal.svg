<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c2240;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <style>
    .terminal-bg { fill: url(#bgGradient); }
    .terminal-header { fill: #24283b; }
    .circle { r: 6; }
    .red { fill: #f7768e; }
    .yellow { fill: #e0af68; }
    .green { fill: #9ece6a; }
    .text { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #a9b1d6; white-space: pre; }
    .prompt-left { fill: #bb9af7; font-weight: bold; filter: url(#glow); }
    .prompt-right { fill: #565f89; }
    .command { 
      fill: #c0caf5; 
      text-shadow: 0 0 2px #c0caf5; 
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .command:hover {
      fill: #7dcfff;
      filter: url(#strongGlow);
    }
    .output-dir { 
      fill: #7aa2f7; 
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .output-dir:hover {
      fill: #9ece6a;
      filter: url(#glow);
    }
    .output-file { 
      fill: #a9b1d6;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .output-file:hover {
      fill: #bb9af7;
      filter: url(#glow);
    }
    .output-success { 
      fill: #9ece6a;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .output-success:hover {
      fill: #7dcfff;
      filter: url(#glow);
    }
    .label { fill: #7dcfff; font-weight: bold; }
    .value { fill: #a9b1d6; }
    .cursor { fill: #c0caf5; animation: blink 1s step-end infinite; filter: url(#glow); }
    .ascii-art { fill: #bb9af7; font-weight: bold; filter: url(#glow); }
    
   /* 10 Frame Dinamik Duman Animasyonu - Hızlandırıldı */
.smoke-frame {
  opacity: 0;
  animation: smoke-cycle 10s steps(10) infinite;
}

.f1  { animation-delay: 0s; }
.f2  { animation-delay: 1s; }
.f3  { animation-delay: 2s; }
.f4  { animation-delay: 3s; }
.f5  { animation-delay: 4s; }
.f6  { animation-delay: 5s; }
.f7  { animation-delay: 6s; }
.f8  { animation-delay: 7s; }
.f9  { animation-delay: 8s; }
.f10 { animation-delay: 9s; }



    @keyframes smoke-cycle {
      0%, 10% { opacity: 1; }
      11%, 100% { opacity: 0; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

