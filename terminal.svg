<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="800" height="820">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <style>
    /* GitHub Arka Plan Rengi: #0d1117 */
    .terminal-bg { fill: #0d1117; }
    .terminal-header { fill: #161b22; }
    .circle { r: 6; }
    .red { fill: #f85149; }
    .yellow { fill: #d29922; }
    .green { fill: #3fb950; }
    .text { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #c9d1d9; white-space: pre; }
    .prompt-left { fill: #d2a8ff; font-weight: bold; filter: url(#glow); }
    .prompt-right { fill: #8b949e; }
    .command { 
      fill: #79c0ff; 
      text-shadow: 0 0 2px #79c0ff; 
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .command:hover {
      fill: #a5d6ff;
      filter: url(#strongGlow);
    }
    .output-dir { 
      fill: #58a6ff; 
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .output-dir:hover {
      fill: #3fb950;
      filter: url(#glow);
    }
    .output-file { 
      fill: #c9d1d9;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .output-file:hover {
      fill: #d2a8ff;
      filter: url(#glow);
    }
    .output-success { 
      fill: #3fb950;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .output-success:hover {
      fill: #58a6ff;
      filter: url(#glow);
    }
    .label { fill: #79c0ff; font-weight: bold; }
    .value { fill: #c9d1d9; }
    .cursor { fill: #c9d1d9; animation: blink 1s step-end infinite; filter: url(#glow); }
    .ascii-art { fill: #d2a8ff; font-weight: bold; filter: url(#glow); }
    
    .smoke-frame {
      opacity: 0;
      animation: smoke-cycle 10s steps(10) infinite;
    }

    .f1  { animation-delay: 0s; }
    .f2  { animation-delay: 1s; }
    .f3  { animation-delay: 2s; }
    .f4  { animation-delay: 3s; }
    .f5  { animation-delay: 4s; }
    .f6  { animation-delay: 5s; }
    .f7  { animation-delay: 6s; }
    .f8  { animation-delay: 7s; }
    .f9  { animation-delay: 8s; }
    .f10 { animation-delay: 9s; }

    @keyframes smoke-cycle {
      0%, 10% { opacity: 1; }
      11%, 100% { opacity: 0; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

